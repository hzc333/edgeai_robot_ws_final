[workspace]
name = "edgeai_robot_ws"
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/robostack-jazzy",
]
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "colcon build --symlink-install"
# 运行全部包的测试；任一测试失败时返回非零（由colcon test-result决定）。需先执行build。
# 各包按顺序运行，并使用独立的DDS域（默认42，可用EDGEAI_TEST_DOMAIN_ID覆盖）且只在本机通信：
# 测试会发布/competition/state、急停等全局话题，不能与其他测试、正在运行的仿真或网络中的真机互相干扰。
test = "bash -c 'source install/setup.bash && export ROS_DOMAIN_ID=${EDGEAI_TEST_DOMAIN_ID:-42} ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST && colcon test --executor sequential --event-handlers console_cohesion+ ; colcon test-result --verbose'"
validate = "python tools/validate_project_contracts.py"
check-env = "bash -c 'source install/setup.bash && python tools/check_environment.py'"
# P3感知包是unittest结构，colcon汇总里不显示其用例数；用pytest单独运行（同样隔离DDS域）。
test-perception = "bash -c 'source install/setup.bash && export ROS_DOMAIN_ID=${EDGEAI_TEST_DOMAIN_ID:-42} ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST && cd src/edgeai_target_perception && python -m pytest -q test'"
# 中期全流程演练（P1～P4全部模块；脚本只扮演操作员）。需先执行build；需要额外参数时直接运行
# tools/midterm_rehearsal.py，见README。
midterm = "bash -c 'source install/setup.bash && python tools/midterm_rehearsal.py'"
midterm-gui = "bash -c 'source install/setup.bash && python tools/midterm_rehearsal.py --gui'"

[dependencies]
# ROS 2 Jazzy
ros2-distro-mutex = ">=0.13,<0.14"
ros-jazzy-ros2cli = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-ros2launch = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-xacro = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-ros-gz = ">=1.0.18,<2"
ros-jazzy-tf2-tools = ">=0.36.18,<0.37"
ros-dev-tools = ">=1.0.2,<2"
ros-jazzy-slam-toolbox = ">=2.8.3,<3"
ros-jazzy-ros2node = ">=0.32.7,<0.33"
ros-jazzy-ros2param = ">=0.32.7,<0.33"
ros-jazzy-ros2interface = ">=0.32.7,<0.33"
ros-jazzy-ros2action = ">=0.32.7,<0.33"
ros-jazzy-nav2-map-server = ">=1.3.10,<2"
ros-jazzy-ros2lifecycle = ">=0.32.7,<0.33"
ros-jazzy-nav2-amcl = ">=1.3.10,<2"
ros-jazzy-nav2-lifecycle-manager = ">=1.3.10,<2"

# Nav2完整导航栈：规划器、控制器、行为树、恢复行为、代价地图及bringup启动文件。
ros-jazzy-navigation2 = ">=1.3.10,<2"
ros-jazzy-nav2-bringup = ">=1.3.10,<2"

# 运行记录：rosbag2及Jazzy默认的MCAP存储插件。
ros-jazzy-rosbag2 = ">=0.26.9,<0.27"
ros-jazzy-rosbag2-storage-mcap = ">=0.26.9,<0.27"

# 感知：OpenCV固定到4.12。ArUco接口在4.7（ArucoDetector）和5.x中均有破坏性变化，
# 升级必须由P3评估并同步修改docs/marker_and_rescue_geometry.md和tools/check_environment.py。
ros-jazzy-cv-bridge = ">=4.1.0,<5"
libopencv = "4.12.*"
py-opencv = "4.12.*"

# colcon（0.19）以`setup.py develop --editable`实现ament_python包的--symlink-install，
# setuptools 80起移除了该选项，导致Python包构建失败。升级colcon并验证后再放开。
setuptools = "<80"
# Jazzy的launch_testing（9.x）pytest插件仍使用pytest 9已移除的`path`钩子参数，
# 不固定会导致所有ROS包的colcon test在收集阶段报错。
pytest = "<9"

# 契约校验与配置解析。
jsonschema = ">=4.18,<5"
pyyaml = ">=6,<7"

[activation]
# 去掉系统ROS（/opt/ros）残留的路径，见脚本说明。
scripts = ["tools/pixi_activate.sh"]

[activation.env]
# RoboStack不设置ROS_DISTRO；显式设置以便rosdep、启动文件和环境检查与系统ROS一致。
ROS_DISTRO = "jazzy"
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
ROS_AUTOMATIC_DISCOVERY_RANGE = "SUBNET"
ROS_DOMAIN_ID = "0"
# 系统ROS（`source /opt/ros/jazzy/setup.bash`）设置的GZ_CONFIG_PATH会让pixi的gz加载
# 系统Gazebo的配置，导致gz sim启动即崩溃；固定为pixi环境自带的配置目录。
GZ_CONFIG_PATH = "$CONDA_PREFIX/share/gz"
