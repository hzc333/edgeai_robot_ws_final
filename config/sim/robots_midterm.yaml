# 中期检查（2026-11-12）用的出生位姿：场地坐标，原点在场地左下角。
# 起始区x 0～1.4 m、y 0～1.0 m。与组织方图1一致，两台并排朝北（朝向开阔场地）。
# 位置保证两台都能在起点原地转向（后角扫过半径0.36 m＋停车区0.05 m＝0.41 m）：
# robot_1离西墙、南墙内表面0.45 m，离robot_2外扩0.08 m后的足迹0.445 m；robot_2右侧
# 车身到x 1.375 m，仍在起始区内。robot_1探索后回到起点、Task 2从起点出发时都要转向
# （2026-11-01：原(0.40, 0.5)离西墙0.35 m，回起点后转向被碰撞监视器停住，C1两次失败）。
# 与competition_parameters.yaml中的起点midterm_robot_1/2一致。
# （朝东一前一后时，robot_1转向会扫到外扩后的robot_2足迹，无法出发。）
# 位姿为base_footprint（驱动轮轴中点，ADR-0002）。
schema_version: 1
robots:
  robot_1: {x: 0.50, y: 0.5, yaw: 1.5707963}
  robot_2: {x: 1.20, y: 0.5, yaw: 1.5707963}
