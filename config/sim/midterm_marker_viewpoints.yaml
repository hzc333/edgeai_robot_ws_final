# 中期场地中能稳定检测到ArUco标记的机器人位姿（P1，2026-10-31实测）。
# 场地坐标，原点在左下角；位姿为base_footprint（驱动轮轴中点）的x、y和朝向yaw（rad），
# 机器人朝向标记。每个位姿都检查过车身与墙、障碍物、支架不重叠，
# 相机到标记的视线不被墙或障碍物遮挡（墙高0.5 m，高于标记）。
# 检测：P3 target_detector（use_depth:=false），每个位姿约60次检测；
# 估计距离与真值之差 <= 0.007 m。相机上仰0.26 rad（URDF camera_joint）。
# 用途：P2探索的视觉覆盖——探索时经过其中任一位姿并停留约1 s即可检测到该标记。
# S1朝南，只能从W1与标记之间约1 m的空间里看到，可用位姿少；C1在1.3 m以内都很稳定，
# 1.3～2.2 m偶有漏检或距离错误（实测一次误差0.19 m）。
schema_version: 1
markers:
  S1:
    marker_id: 1
    center: [1.0, 4.1]
    viewpoints:
      - {x: 0.51, y: 3.61, yaw: 0.79, range_m: 0.6}
      - {x: 1.49, y: 3.61, yaw: 2.36, range_m: 0.6}
      - {x: 1.60, y: 3.76, yaw: 2.62, range_m: 0.6}
      - {x: 1.77, y: 3.66, yaw: 2.62, range_m: 0.8}
  C1:
    marker_id: 2
    center: [4.1, 1.0]
    viewpoints:
      - {x: 4.10, y: 1.69, yaw: -1.57, range_m: 0.6}
      - {x: 4.44, y: 1.60, yaw: -2.09, range_m: 0.6}
      - {x: 3.92, y: 1.66, yaw: -1.31, range_m: 0.6}
      - {x: 4.10, y: 1.89, yaw: -1.57, range_m: 0.8}
      - {x: 4.54, y: 1.77, yaw: -2.09, range_m: 0.8}
      - {x: 3.87, y: 1.86, yaw: -1.31, range_m: 0.8}
      - {x: 4.10, y: 2.09, yaw: -1.57, range_m: 1.0}
      - {x: 4.38, y: 2.05, yaw: -1.83, range_m: 1.0}
      - {x: 3.82, y: 2.05, yaw: -1.31, range_m: 1.0}
      - {x: 4.46, y: 2.34, yaw: -1.83, range_m: 1.3}
      - {x: 3.74, y: 2.34, yaw: -1.31, range_m: 1.3}
